<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Malkum365 CRM</title>

<link
rel="stylesheet"
href="crm.css">

</head>

<body>

<!-- ========================================
CRM 전체 레이아웃
======================================== -->

<div class="crm-container">

    <!-- ========================================
    좌측 사이드바
    ======================================== -->

    <aside class="crm-sidebar">

        <div class="logo-area">

            <h1>MALKUM365</h1>

            <p>CRM SYSTEM</p>

        </div>

        <nav class="menu-area">

            <button class="menu-btn active">
                실시간 고객
            </button>

            <button class="menu-btn">
                상담 예정
            </button>

            <button class="menu-btn">
                상담 완료
            </button>

            <button class="menu-btn">
                구매 완료
            </button>

        </nav>

    </aside>

    <!-- ========================================
    메인 영역
    ======================================== -->

    <main class="crm-main">

        <!-- ========================================
        상단 헤더
        ======================================== -->

        <header class="crm-header">

            <div class="header-left">

                <h2>
                    실시간 고객관리
                </h2>

            </div>

            <div class="header-right">

                <div class="realtime-box">

                    ● 실시간 연결중

                </div>

            </div>

        </header>

        <!-- ========================================
        고객 리스트 영역
        ======================================== -->

        <section class="crm-content">

            <table class="crm-table">

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>상태</th>

                        <th>이름</th>

                        <th>연락처</th>

                        <th>상담분야</th>

                        <th>예약시간</th>

                        <th>메모</th>

                    </tr>

                </thead>

                <tbody id="crmTableBody">

                    <!-- JS 실시간 삽입 -->

                </tbody>

            </table>

        </section>

    </main>

</div>

<script src="crm.js"></script>

</body>

</html>
