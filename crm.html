<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CUSTOMER MANAGEMENT</title>

<link rel="stylesheet"
href="crm.css">

</head>

<body>

<div class="crm-wrap">

    <!-- =========================
         좌측 메뉴
    ========================== -->

    <aside class="sidebar">

        <div class="logo-box">

            <h1>CUSTOMER</h1>

            <p>MANAGEMENT</p>

        </div>

        <div class="menu-list">

            <button class="menu-btn">
                신규등록
            </button>

            <button class="menu-btn">
                무료신청
            </button>

            <button class="menu-btn">
                상담예정
            </button>

            <button class="menu-btn">
                진행중
            </button>

            <button class="menu-btn">
                완료
            </button>

            <button class="menu-btn">
                고객메모
            </button>

            <button class="menu-btn active">
                알람설정
            </button>

        </div>

    </aside>

    <!-- =========================
         메인
    ========================== -->

    <main class="main-area">

        <!-- 상단 -->

        <div class="top-bar">

            <div class="top-title">

                CUSTOMER CRM

            </div>

        </div>

        <!-- 테이블 -->

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>이름</th>

                        <th>연락처</th>

                        <th>상담일</th>

                        <th>상태</th>

                        <th>메모</th>

                    </tr>

                </thead>

                <tbody id="crmBody">

                </tbody>

            </table>

        </div>

    </main>

</div>

<!-- =========================
     Supabase CDN
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- =========================
     CRM JS
========================= -->

<script src="crm.js"></script>

</body>

</html>
