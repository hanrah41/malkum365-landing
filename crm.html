<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CUSTOMER CRM</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   CUSTOMER CRM
   파일: C:\malkum365-landing\crm.html

   중요:
   - index.html 수정 금지
   - CRM 전용 화면
   - crm.js는 그대로 사용
   - 종료 버튼 배경색 #7BE8B8 적용
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;

    width:100%;
    height:100%;

    font-family:Arial, sans-serif;

    background:#d9d9d9;

    color:#111;

    overflow:hidden;
}

/* =====================================================
   전체 구조
===================================================== */

.crm-app{
    width:100%;
    height:100vh;

    display:flex;

    background:#d9d9d9;
}

/* =====================================================
   좌측 메뉴
===================================================== */

.crm-sidebar{
    width:120px;
    min-width:120px;
    max-width:120px;

    height:100vh;

    background:#11141c;

    overflow:hidden;
}

.crm-logo{
    width:120px;

    padding-top:8px;
    padding-left:7px;
    padding-bottom:13px;

    color:#ffffff;
}

.crm-logo-main{
    font-size:14px;
    font-weight:400;

    line-height:16px;

    letter-spacing:0.5px;
}

.crm-logo-sub{
    margin-top:4px;

    font-size:10px;
    font-weight:400;

    line-height:12px;

    letter-spacing:3px;
}

/* =====================================================
   메뉴 버튼
===================================================== */

.menu-btn{
    display:block;

    width:114px;
    height:29px;

    margin-left:6px;
    margin-bottom:3px;

    padding:0;

    border:none;

    background:#171b25;
    color:#ffffff;

    font-size:12px;
    font-weight:400;

    text-align:center;

    cursor:pointer;
}

.menu-btn:hover{
    background:#2a2f3c;
}

.menu-btn.active{
    background:#d8d2b5;
    color:#000000;

    font-weight:400;
}

/* =====================================================
   우측 본문
===================================================== */

.crm-content{
    flex:1;

    height:100vh;

    background:#d9d9d9;

    overflow:hidden;
}

.crm-title{
    width:100%;
    height:27px;

    padding-left:10px;

    display:flex;
    align-items:center;

    background:#eeeeee;

    color:#000000;

    font-size:12px;
    font-weight:400;
}

/* =====================================================
   테이블 영역
===================================================== */

.crm-table-wrap{
    width:100%;
    height:calc(100vh - 27px);

    padding-top:28px;
    padding-left:20px;
    padding-right:20px;

    overflow:auto;

    background:#d9d9d9;
}

/* =====================================================
   CRM 테이블 기본
===================================================== */

.crm-table{
    width:auto !important;

    max-width:none !important;

    border-collapse:collapse !important;

    table-layout:fixed !important;

    background:#ffffff;

    font-size:12px;
}

/* =====================================================
   테이블 셀 공통
===================================================== */

.crm-table th,
.crm-table td{
    height:29px !important;

    padding:2px 4px !important;

    border:1px solid #bfbfbf !important;

    font-size:12px !important;
    font-weight:400 !important;

    text-align:center !important;
    vertical-align:middle !important;

    white-space:nowrap !important;
    overflow:hidden !important;
    text-overflow:ellipsis !important;
}

/* 헤더 */
.crm-table th{
    background:#242424 !important;
    color:#ffffff !important;

    font-weight:400 !important;
}

/* 본문 */
.crm-table td{
    background:#f5efcc !important;
    color:#000000 !important;

    font-weight:400 !important;
}

/* =====================================================
   컬럼 폭 강제 지정
===================================================== */

/* ID */
.crm-table th:nth-child(1),
.crm-table td:nth-child(1){
    width:32px !important;
    min-width:32px !important;
    max-width:32px !important;
}

/* 이름 */
.crm-table th:nth-child(2),
.crm-table td:nth-child(2){
    width:74px !important;
    min-width:74px !important;
    max-width:74px !important;
}

/* 연락처 */
.crm-table th:nth-child(3),
.crm-table td:nth-child(3){
    width:124px !important;
    min-width:124px !important;
    max-width:124px !important;
}

/* 상담신청일 */
.crm-table th:nth-child(4),
.crm-table td:nth-child(4){
    width:150px !important;
    min-width:150px !important;
    max-width:150px !important;
}

/* 상태 */
.crm-table th:nth-child(5),
.crm-table td:nth-child(5){
    width:285px !important;
    min-width:285px !important;
    max-width:285px !important;
}

/* 상담 예정일 */
.crm-table th:nth-child(6),
.crm-table td:nth-child(6){
    width:126px !important;
    min-width:126px !important;
    max-width:126px !important;
}

/* 종료 */
.crm-table th:nth-child(7),
.crm-table td:nth-child(7){
    width:52px !important;
    min-width:52px !important;
    max-width:52px !important;
}

/* =====================================================
   수정 가능 셀
===================================================== */

.editable-cell,
.editable-reserve{
    cursor:pointer;
}

.editable-cell:hover,
.editable-reserve:hover{
    background:#fff6b8 !important;
}

/* =====================================================
   종료 버튼
   배경색 #7BE8B8 적용
===================================================== */

.finish-btn{
    width:40px !important;
    height:20px !important;

    padding:0 !important;

    border:1px solid #999;
    border-radius:3px;

    background:#7BE8B8 !important;
    color:#222222 !important;

    font-size:10px !important;
    font-weight:400 !important;

    cursor:pointer;
}

.finish-btn:hover{
    background:#7BE8B8 !important;
    color:#000000 !important;
}

/* =====================================================
   전체 bold 제거
===================================================== */

button,
th,
td,
.menu-btn,
.finish-btn{
    font-weight:400 !important;
}

</style>

</head>

<body>

<div class="crm-app">

    <!-- =================================================
         좌측 메뉴
    ================================================== -->

    <aside class="crm-sidebar">

        <div class="crm-logo">

            <div class="crm-logo-main">
                CUSTOMER
            </div>

            <div class="crm-logo-sub">
                MANAGEMENT
            </div>

        </div>

        <button class="menu-btn" data-mode="new">
            소개등록
        </button>

        <button class="menu-btn active" data-mode="introduce">
            소개명단
        </button>

        <button class="menu-btn" data-mode="customer">
            고객명단
        </button>

        <button class="menu-btn" data-mode="reserve">
            상담예정
        </button>

        <button class="menu-btn" data-mode="process">
            진행중
        </button>

        <button class="menu-btn" data-mode="done">
            완료
        </button>

        <button class="menu-btn" data-mode="memo">
            고객메모
        </button>

        <button class="menu-btn" data-mode="alarm">
            알람설정
        </button>

    </aside>

    <!-- =================================================
         우측 CRM 본문
    ================================================== -->

    <main class="crm-content">

        <div class="crm-title">
            CUSTOMER CRM
        </div>

        <div class="crm-table-wrap">

            <table class="crm-table">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>이름</th>
                        <th>연락처</th>
                        <th>상담신청일</th>
                        <th>상태</th>
                        <th>상담 예정일</th>
                        <th>종료</th>
                    </tr>

                </thead>

                <tbody id="crmBody"></tbody>

            </table>

        </div>

    </main>

</div>

<script src="crm.js"></script>

</body>

</html>
