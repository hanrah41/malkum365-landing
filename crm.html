<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CUSTOMER CRM</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   CUSTOMER CRM
   파일: C:\malkum365-landing\crm.html
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;

    width:100%;
    height:100%;

    font-family:Arial, sans-serif;

    background:#9a9a9a;

    color:#111;

    overflow:hidden;
}

/* =====================================================
   전체 구조
===================================================== */

.crm-app{
    width:100%;
    height:100vh;

    display:flex;

    background:#9a9a9a;
}

/* =====================================================
   좌측 메뉴
===================================================== */

.crm-sidebar{
    width:130px;
    min-width:130px;
    max-width:130px;

    height:100vh;

    background:#080c12;

    overflow:hidden;
}

.crm-logo{
    width:130px;

    padding-top:8px;
    padding-left:8px;
    padding-bottom:13px;

    color:#ffffff;
}

.crm-logo-main{
    font-size:14px;
    font-weight:400;

    line-height:16px;

    letter-spacing:0.5px;
}

.crm-logo-sub{
    margin-top:4px;

    font-size:10px;
    font-weight:400;

    line-height:12px;

    letter-spacing:3px;
}

/* =====================================================
   메뉴 버튼
   red 박스 우측 잘라낸 크기 기준
   텍스트는 배경색 박스 중앙 정렬
===================================================== */

.menu-btn{
    display:block;

    width:90px;
    height:29px;

    margin-left:34px;
    margin-bottom:3px;

    padding:0;

    border:none;

    background:#111722;
    color:#ffffff;

    font-size:12px;
    font-weight:400;

    text-align:center;
    line-height:29px;

    cursor:pointer;

    overflow:hidden;
    white-space:nowrap;
}

.menu-btn:hover{
    background:#2a2f3c;
}

.menu-btn.active{
    background:#d8d2b5;
    color:#000000;

    font-weight:400;
}

/* =====================================================
   우측 본문
===================================================== */

.crm-content{
    flex:1;

    height:100vh;

    background:#9a9a9a;

    overflow:hidden;
}

.crm-title{
    width:100%;
    height:27px;

    padding-left:10px;

    display:flex;
    align-items:center;

    background:#eeeeee;

    color:#000000;

    font-size:12px;
    font-weight:400;
}

/* =====================================================
   테이블 영역
===================================================== */

.crm-table-wrap{
    width:100%;
    height:calc(100vh - 27px);

    padding-top:28px;
    padding-left:20px;
    padding-right:20px;

    overflow:auto;

    background:#9a9a9a;
}

/* =====================================================
   CRM 테이블
===================================================== */

.crm-table{
    width:auto !important;

    max-width:none !important;

    border-collapse:collapse !important;

    table-layout:fixed !important;

    background:#ffffff;

    font-size:12px;
}

.crm-table th,
.crm-table td{
    height:29px !important;

    padding:2px 4px !important;

    border:1px solid #8f8f8f !important;

    font-size:12px !important;
    font-weight:400 !important;

    text-align:center;
    vertical-align:middle !important;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.crm-table th{
    background:#1f1f1f !important;
    color:#ffffff !important;

    font-weight:400 !important;
}

.crm-table td{
    background:#f5efcc !important;
    color:#000000 !important;

    font-weight:400 !important;
}

/* ID */
.crm-table th:nth-child(1),
.crm-table td:nth-child(1){
    width:32px !important;
    min-width:32px !important;
    max-width:32px !important;
}

/* 이름 */
.crm-table th:nth-child(2),
.crm-table td:nth-child(2){
    width:74px !important;
    min-width:74px !important;
    max-width:74px !important;
}

/* 연락처 */
.crm-table th:nth-child(3),
.crm-table td:nth-child(3){
    width:124px !important;
    min-width:124px !important;
    max-width:124px !important;
}

/* 상담신청일 */
.crm-table th:nth-child(4),
.crm-table td:nth-child(4){
    width:150px !important;
    min-width:150px !important;
    max-width:150px !important;
}

/* 상태 */
.crm-table th:nth-child(5),
.crm-table td:nth-child(5){
    width:285px !important;
    min-width:285px !important;
    max-width:285px !important;

    padding:2px 4px !important;
}

/* 상담 예정일 */
.crm-table th:nth-child(6),
.crm-table td:nth-child(6){
    width:126px !important;
    min-width:126px !important;
    max-width:126px !important;
}

/* 종료 */
.crm-table th:nth-child(7),
.crm-table td:nth-child(7){
    width:52px !important;
    min-width:52px !important;
    max-width:52px !important;
}

/* =====================================================
   상태 입력창
===================================================== */

.status-input{
    width:100%;
    height:23px;

    padding:2px 5px;

    border:1px solid #a9a9a9;
    border-radius:2px;

    background:#ffffff;
    color:#000000;

    font-size:11px;
    font-weight:400;

    outline:none;

    text-align:left;

    cursor:pointer;
}

.status-input:focus{
    border-color:#7BE8B8;
    background:#ffffff;
}

/* =====================================================
   상담내용 A4 1/4 창
===================================================== */

.counsel-modal{
    display:none;

    position:fixed;

    left:0;
    top:0;

    width:100vw;
    height:100vh;

    background:rgba(0,0,0,0.35);

    z-index:9999;

    align-items:center;
    justify-content:center;
}

.counsel-modal.show{
    display:flex;
}

.counsel-panel{
    width:105mm;
    height:148.5mm;

    background:#ffffff;

    border:1px solid #555;

    box-shadow:0 8px 24px rgba(0,0,0,0.35);

    display:flex;
    flex-direction:column;
}

.counsel-header{
    height:32px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 8px;

    background:#242424;
    color:#ffffff;

    font-size:12px;
    font-weight:400;
}

.counsel-title{
    font-size:12px;
    font-weight:400;
}

.counsel-close{
    width:24px;
    height:24px;

    border:none;

    background:#444;
    color:#ffffff;

    font-size:14px;
    font-weight:400;

    cursor:pointer;
}

.counsel-close:hover{
    background:#666;
}

.counsel-body{
    flex:1;

    padding:8px;

    background:#f7f7f7;
}

#counselTextArea{
    width:100%;
    height:100%;

    resize:none;

    padding:8px;

    border:1px solid #bfbfbf;

    background:#ffffff;
    color:#000000;

    font-size:13px;
    font-weight:400;

    line-height:1.55;

    outline:none;
}

#counselTextArea:focus{
    border-color:#7BE8B8;
}

.counsel-footer{
    height:38px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:flex-end;

    gap:6px;

    padding:6px 8px;

    background:#eeeeee;

    border-top:1px solid #cfcfcf;
}

.counsel-save-btn,
.counsel-cancel-btn{
    width:58px;
    height:24px;

    border:1px solid #999;
    border-radius:3px;

    font-size:11px;
    font-weight:400;

    cursor:pointer;
}

.counsel-save-btn{
    background:#7BE8B8;
    color:#000000;
}

.counsel-cancel-btn{
    background:#ffffff;
    color:#000000;
}

/* =====================================================
   수정 가능 셀
===================================================== */

.editable-cell,
.editable-reserve{
    cursor:pointer;
}

.editable-cell:hover,
.editable-reserve:hover{
    background:#fff6b8 !important;
}

/* =====================================================
   종료 버튼
===================================================== */

.finish-btn{
    width:40px !important;
    height:20px !important;

    padding:0 !important;

    border:1px solid #999;
    border-radius:3px;

    background:#7BE8B8 !important;
    color:#222222 !important;

    font-size:10px !important;
    font-weight:400 !important;

    cursor:pointer;
}

.finish-btn:hover{
    background:#7BE8B8 !important;
    color:#000000 !important;
}

/* =====================================================
   bold 제거
===================================================== */

button,
th,
td,
.menu-btn,
.finish-btn,
.status-input,
.counsel-save-btn,
.counsel-cancel-btn,
.counsel-close{
    font-weight:400 !important;
}

</style>

</head>

<body>

<div class="crm-app">

    <aside class="crm-sidebar">

        <div class="crm-logo">

            <div class="crm-logo-main">
                CUSTOMER
            </div>

            <div class="crm-logo-sub">
                MANAGEMENT
            </div>

        </div>

        <button class="menu-btn" data-mode="new">
            소개등록
        </button>

        <button class="menu-btn active" data-mode="introduce">
            소개명단
        </button>

        <button class="menu-btn" data-mode="customer">
            고객명단
        </button>

        <button class="menu-btn" data-mode="reserve">
            상담예정
        </button>

        <button class="menu-btn" data-mode="process">
            진행중
        </button>

        <button class="menu-btn" data-mode="done">
            완료
        </button>

        <button class="menu-btn" data-mode="memo">
            고객메모
        </button>

        <button class="menu-btn" data-mode="alarm">
            알람설정
        </button>

    </aside>

    <main class="crm-content">

        <div class="crm-title">
            CUSTOMER CRM
        </div>

        <div class="crm-table-wrap">

            <table class="crm-table">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>이름</th>
                        <th>연락처</th>
                        <th>상담신청일</th>
                        <th>상태</th>
                        <th>상담 예정일</th>
                        <th>종료</th>
                    </tr>

                </thead>

                <tbody id="crmBody"></tbody>

            </table>

        </div>

    </main>

</div>

<div id="counselModal" class="counsel-modal">

    <div class="counsel-panel">

        <div class="counsel-header">

            <div class="counsel-title">
                상담내용 입력
            </div>

            <button id="counselCloseBtn" class="counsel-close" type="button">
                ×
            </button>

        </div>

        <div class="counsel-body">

            <textarea id="counselTextArea"></textarea>

        </div>

        <div class="counsel-footer">

            <button id="counselCancelBtn" class="counsel-cancel-btn" type="button">
                취소
            </button>

            <button id="counselSaveBtn" class="counsel-save-btn" type="button">
                저장
            </button>

        </div>

    </div>

</div>

<script src="crm.js"></script>

</body>

</html>
