<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>랜딩페이지</title>

<style>

/* =====================================================
   기본 설정
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    background:#d9dddd;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:
    "Pretendard",
    "Noto Sans KR",
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    sans-serif;
}


/* =====================================================
   무료 상담 신청 폼
   기존 폼 형태 유지
===================================================== */

.consult-wrap{
    width:440px;

    background:#f4f4f4;

    border-radius:36px;

    padding:
    44px
    30px
    42px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.08);
}


/* =====================================================
   제목
===================================================== */

.consult-title{
    text-align:center;

    font-size:48px;
    font-weight:800;

    color:#003b4d;

    line-height:1.25;

    margin-bottom:38px;
}


/* =====================================================
   입력창
===================================================== */

.input-row{
    width:100%;

    margin-bottom:24px;
}

.input-row input{
    width:100%;
    height:74px;

    border:
    4px solid #c8ccd4;

    border-radius:22px;

    background:#dfe4ee;

    padding:
    0
    26px;

    color:#333;

    font-size:28px;
    font-weight:400;

    outline:none;
}

.input-row input::placeholder{
    color:#666;
}


/* =====================================================
   체크박스
   중요:
   script.js가 .check-area input[type="checkbox"]를 찾으므로
   클래스명 check-area 반드시 유지
===================================================== */

.check-area{
    width:100%;

    margin-top:8px;
    margin-bottom:30px;
}

.agree-line{
    display:flex;
    align-items:center;

    width:100%;

    margin-bottom:16px;

    color:#003b4d;

    font-size:22px;
    font-weight:400;

    line-height:1.35;
}

.agree-line input[type="checkbox"]{
    width:24px;
    height:24px;

    margin-right:13px;

    flex:0 0 auto;
}

.agree-text{
    display:inline-flex;
    align-items:center;
    flex-wrap:wrap;

    gap:4px;
}

.required{
    color:red;
    font-weight:700;
}


/* =====================================================
   개인정보 자세히 보기 버튼
===================================================== */

.privacy-detail-btn{
    margin-left:6px;

    padding:0;

    border:none;

    background:transparent;

    color:#6f7480;

    font-size:15px;
    font-weight:400;

    cursor:pointer;

    text-decoration:underline;

    white-space:nowrap;
}

.privacy-detail-btn:hover{
    color:#003b4d;
}


/* =====================================================
   신청 버튼
===================================================== */

.submit-btn{
    width:100%;
    height:112px;

    border:none;

    border-radius:30px;

    background:#ff8a00;

    color:#ffffff;

    font-size:34px;
    font-weight:800;

    cursor:pointer;

    transition:opacity 0.2s ease;
}

.submit-btn:hover{
    opacity:0.92;
}


/* =====================================================
   하단 안내 문구
===================================================== */

.notice-text{
    margin-top:34px;

    text-align:center;

    color:#6f7480;

    font-size:20px;
    font-weight:400;

    line-height:1.6;
}


/* =====================================================
   개인정보 수집·이용 동의 팝업
===================================================== */

.privacy-modal{
    display:none;

    position:fixed;

    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:9999;
}

.privacy-modal.show{
    display:block;
}

.privacy-modal-bg{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.35);
}

.privacy-modal-box{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%, -50%);

    width:86%;
    max-width:390px;

    background:#ffffff;

    border-radius:18px;

    padding:
    28px
    26px
    24px;

    box-shadow:
    0 18px 45px rgba(0,0,0,0.25);
}

.privacy-modal-title{
    margin-bottom:22px;

    padding-right:34px;

    color:#111;

    font-size:20px;
    font-weight:700;

    line-height:1.4;
}

.privacy-modal-close{
    position:absolute;

    right:20px;
    top:18px;

    width:30px;
    height:30px;

    border:none;

    background:transparent;

    color:#999;

    font-size:30px;
    line-height:30px;

    cursor:pointer;
}

.privacy-modal-close:hover{
    color:#333;
}

.privacy-modal-content{
    color:#111;

    font-size:15px;
    font-weight:400;

    line-height:1.85;
}

.privacy-modal-content p{
    margin-bottom:4px;
}

.privacy-modal-notice{
    margin-top:20px;

    color:#111;

    line-height:1.75;
}


/* =====================================================
   모바일 보정
===================================================== */

@media screen and (max-width:520px){

    body{
        align-items:flex-start;

        padding:
        24px
        0;
    }

    .consult-wrap{
        width:86%;

        padding:
        42px
        30px
        40px;

        border-radius:34px;
    }

    .consult-title{
        font-size:45px;

        margin-bottom:36px;
    }

    .input-row input{
        height:76px;

        font-size:27px;
    }

    .agree-line{
        font-size:22px;
    }

    .submit-btn{
        height:112px;

        font-size:34px;
    }

    .notice-text{
        font-size:20px;
    }
}

</style>

</head>

<body>

<div class="consult-wrap">

    <div class="consult-title">
        무료 상담 신청
    </div>

    <div class="input-row">

        <input
            type="text"
            id="name"
            placeholder="이름 입력"
            autocomplete="name"
        >

    </div>

    <div class="input-row">

        <input
            type="tel"
            id="phone"
            placeholder="전화번호 입력"
            autocomplete="tel"
        >

    </div>

    <div class="check-area">

        <label class="agree-line">

            <input
                type="checkbox"
                id="ageCheck"
            >

            <span class="agree-text">
                만 14세 이상입니다.
                <span class="required">[필수]</span>
            </span>

        </label>

        <label class="agree-line">

            <input
                type="checkbox"
                id="privacyCheck"
            >

            <span class="agree-text">
                개인정보 수집·이용 동의
                <span class="required">[필수]</span>

                <button
                    type="button"
                    id="privacyDetailBtn"
                    class="privacy-detail-btn"
                >
                    자세히 보기
                </button>
            </span>

        </label>

    </div>

    <button
        type="button"
        id="submitBtn"
        class="submit-btn"
    >
        무료 상담 신청하기
    </button>

    <div class="notice-text">
        입력하신 정보는 상담 목적으로만 사용됩니다.
    </div>

</div>


<!-- =====================================================
     개인정보 수집·이용 동의 상세 팝업
===================================================== -->

<div
    id="privacyModal"
    class="privacy-modal"
>

    <div
        id="privacyModalBg"
        class="privacy-modal-bg"
    ></div>

    <div class="privacy-modal-box">

        <button
            type="button"
            id="privacyModalClose"
            class="privacy-modal-close"
        >
            ×
        </button>

        <div class="privacy-modal-title">
            개인정보 수집 및 이용 동의
        </div>

        <div class="privacy-modal-content">

            <p>
                • 수집·이용 목적 : 무료상담 신청 확인 및 상담 연락
            </p>

            <p>
                • 수집 항목 : 이름, 전화번호
            </p>

            <p>
                • 보유·이용기간 : 상담 신청일로부터 3개월까지 보관 후 파기
            </p>

            <p class="privacy-modal-notice">
                ※ 개인정보 수집 및 이용에 대한 동의를 거부할 권리가 있습니다.<br>
                다만, 동의를 거부할 경우 무료상담 신청 및 상담 연락이 제한될 수 있습니다.
            </p>

        </div>

    </div>

</div>


<!-- =====================================================
     개인정보 자세히 보기 팝업 기능
     기존 script.js 저장 기능과 분리
===================================================== -->

<script>

(function(){

    const privacyDetailBtn =
    document.getElementById(
        'privacyDetailBtn'
    );

    const privacyModal =
    document.getElementById(
        'privacyModal'
    );

    const privacyModalClose =
    document.getElementById(
        'privacyModalClose'
    );

    const privacyModalBg =
    document.getElementById(
        'privacyModalBg'
    );

    if(!privacyDetailBtn || !privacyModal){

        return;
    }

    privacyDetailBtn.addEventListener(
        'click',
        function(event){

            event.preventDefault();
            event.stopPropagation();

            privacyModal.classList.add(
                'show'
            );
        }
    );

    if(privacyModalClose){

        privacyModalClose.addEventListener(
            'click',
            function(){

                privacyModal.classList.remove(
                    'show'
                );
            }
        );
    }

    if(privacyModalBg){

        privacyModalBg.addEventListener(
            'click',
            function(){

                privacyModal.classList.remove(
                    'show'
                );
            }
        );
    }

})();

</script>


<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 기존 무료상담신청 저장 코드 -->
<script src="script.js"></script>

</body>

</html>
