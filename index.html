<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CUSTOMER CRM</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="app">

    <!-- =========================
         좌측 메뉴
    ========================== -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-main">
                CUSTOMER
            </div>

            <div class="brand-sub">
                MANAGEMENT
            </div>

        </div>

        <button class="menu-btn" data-mode="new">
            소개등록
        </button>

        <button class="menu-btn active" data-mode="introduce">
            소개명단
        </button>

        <button class="menu-btn" data-mode="customer">
            고객명단
        </button>

        <button class="menu-btn" data-mode="reserve">
            상담예정
        </button>

        <button class="menu-btn" data-mode="process">
            진행중
        </button>

        <button class="menu-btn" data-mode="done">
            완료
        </button>

        <button class="menu-btn" data-mode="memo">
            고객메모
        </button>

        <button class="menu-btn" data-mode="alarm">
            알람설정
        </button>

    </aside>

    <!-- =========================
         우측 본문
    ========================== -->

    <main class="content">

        <div class="top-title">
            CUSTOMER CRM
        </div>

        <div class="table-area">

            <table class="crm-table">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>이름</th>
                        <th>연락처</th>
                        <th>상담신청일</th>
                        <th>상태</th>
                        <th>상담 예정일</th>
                        <th>종료</th>
                    </tr>

                </thead>

                <tbody id="crmBody"></tbody>

            </table>

        </div>

    </main>

</div>

<script src="crm.js"></script>

</body>

</html>
