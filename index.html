<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>랜딩페이지</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    width:100%;
    min-height:100vh;

    background:#d9dddd;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:
    "Pretendard",
    "Noto Sans KR",
    sans-serif;
}

/* =========================================
   상담 박스
========================================= */

.consult-wrap{

    width:440px;

    background:#f4f4f4;

    border-radius:36px;

    padding:
    40px
    30px
    40px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.08);
}

/* =========================================
   타이틀
========================================= */

.title{

    text-align:center;

    font-size:64px;
    font-weight:800;

    color:#003b4d;

    line-height:1.2;

    margin-bottom:40px;
}

/* =========================================
   입력창
========================================= */

.input-box{
    margin-bottom:22px;
}

.input-box input{

    width:100%;
    height:78px;

    border:
    5px solid #c8ccd4;

    border-radius:24px;

    background:#dfe4ee;

    padding:0 26px;

    font-size:28px;

    outline:none;

    color:#555;
}

.input-box input::placeholder{
    color:#666;
}

/* =========================================
   체크박스
========================================= */

.check-area{

    margin-top:10px;
    margin-bottom:28px;
}

.check-item{

    display:flex;
    align-items:center;

    gap:14px;

    margin-bottom:16px;

    font-size:22px;

    color:#003b4d;
}

.check-item input{

    width:24px;
    height:24px;
}

.required{
    color:red;
    font-weight:700;
}

/* =========================================
   버튼
========================================= */

.submit-btn{

    width:100%;
    height:112px;

    border:none;

    border-radius:32px;

    background:#ff8a00;

    color:#fff;

    font-size:34px;
    font-weight:800;

    cursor:pointer;

    transition:0.2s;
}

.submit-btn:hover{
    opacity:0.92;
}

/* =========================================
   하단 문구
========================================= */

.bottom-text{

    margin-top:34px;

    text-align:center;

    font-size:20px;

    color:#6f7480;

    line-height:1.6;
}

</style>

</head>

<body>

<div class="consult-wrap">

    <div class="title">
        무료 상담 신청
    </div>

    <div class="input-box">

        <input
            type="text"
            id="name"
            placeholder="이름 입력"
        >

    </div>

    <div class="input-box">

        <input
            type="tel"
            id="phone"
            placeholder="전화번호 입력"
        >

    </div>

    <div class="check-area">

        <label class="check-item">

            <input
                type="checkbox"
                checked
            >

            <span>
                만 14세 이상입니다.
                <span class="required">[필수]</span>
            </span>

        </label>

        <label class="check-item">

            <input
                type="checkbox"
                checked
            >

            <span>
                개인정보 수집·이용 동의
                <span class="required">[필수]</span>
            </span>

        </label>

    </div>

    <button
        type="button"
        class="submit-btn"
        id="submitBtn"
        onclick="submitConsultation()"
    >
        무료 상담 신청하기
    </button>

    <div class="bottom-text">
        입력하신 정보는 상담 목적으로만 사용됩니다.
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
