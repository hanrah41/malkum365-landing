<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>랜딩페이지</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    width:100%;
    min-height:100vh;

    background:#d9dddd;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:
    "Pretendard",
    "Noto Sans KR",
    sans-serif;
}

/* =========================================
   상담 박스
========================================= */

.consult-wrap{

    width:440px;

    background:#f4f4f4;

    border-radius:36px;

    padding:
    40px
    30px
    40px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.08);
}

/* =========================================
   타이틀
========================================= */

.title{

    text-align:center;

    font-size:50px;
    font-weight:800;

    color:#003b4d;

    line-height:1.15;

    margin-bottom:40px;

    white-space:nowrap;
    word-break:keep-all;
    letter-spacing:-2px;
}

/* =========================================
   입력창
========================================= */

.input-box{
    margin-bottom:22px;
}

.input-box input{

    width:100%;
    height:78px;

    border:
    5px solid #c8ccd4;

    border-radius:24px;

    background:#dfe4ee;

    padding:0 26px;

    font-size:28px;

    outline:none;

    color:#111;
}

.input-box input::placeholder{
    color:#666;
}

/* =========================================
   체크박스
========================================= */

.check-area{

    margin-top:10px;
    margin-bottom:28px;
}

.check-item{

    display:flex;
    align-items:center;

    gap:14px;

    margin-bottom:16px;

    font-size:22px;

    color:#003b4d;
}

.check-item input{

    width:24px;
    height:24px;
}

.required{

    color:red;
    font-weight:700;
}

/* =========================================
   버튼
========================================= */

.submit-btn{

    width:100%;
    height:112px;

    border:none;

    border-radius:32px;

    background:#ff8a00;

    color:#fff;

    font-size:34px;
    font-weight:800;

    cursor:pointer;

    transition:0.2s;
}

.submit-btn:hover{
    opacity:0.92;
}

/* =========================================
   하단 문구
========================================= */

.bottom-text{

    margin-top:34px;

    text-align:center;

    font-size:20px;

    color:#6f7480;

    line-height:1.6;
}

/* =========================================
   모바일 보정
========================================= */

@media (max-width:520px){

    body{
        align-items:center;
    }

    .consult-wrap{

        width:calc(100% - 48px);

        padding:
        36px
        22px
        36px;

        border-radius:32px;
    }

    .title{

        font-size:42px;

        line-height:1.12;

        margin-bottom:36px;

        white-space:nowrap;
        word-break:keep-all;
        letter-spacing:-2.5px;
    }

    .input-box input{

        height:70px;

        font-size:24px;

        border-radius:22px;

        padding:0 22px;
    }

    .check-item{

        font-size:18px;

        gap:12px;
    }

    .check-item input{

        width:22px;
        height:22px;
    }

    .submit-btn{

        height:96px;

        font-size:28px;

        border-radius:28px;
    }

    .bottom-text{

        font-size:17px;

        margin-top:28px;
    }
}

/* =========================================
   작은 모바일 추가 보정
========================================= */

@media (max-width:390px){

    .consult-wrap{

        width:calc(100% - 36px);

        padding:
        34px
        18px
        34px;
    }

    .title{

        font-size:36px;

        letter-spacing:-2.8px;

        white-space:nowrap;
        word-break:keep-all;
    }

    .submit-btn{

        font-size:25px;
    }
}

</style>

</head>

<body>

<div class="consult-wrap">

    <div class="title">
        무료 상담 신청
    </div>

    <div class="input-box">

        <input
            type="text"
            id="name"
            name="consult_name_no_autofill"
            placeholder="이름 입력"
            autocomplete="new-password"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
        >

    </div>

    <div class="input-box">

        <input
            type="tel"
            id="phone"
            name="consult_phone_no_autofill"
            placeholder="전화번호 입력"
            autocomplete="new-password"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
        >

    </div>

    <div class="check-area">

        <label class="check-item">

            <input
                type="checkbox"
            >

            <span>
                만 14세 이상입니다.
                <span class="required">[필수]</span>
            </span>

        </label>

        <label class="check-item">

            <input
                type="checkbox"
            >

            <span>
                개인정보 수집·이용 동의
                <span class="required">[필수]</span>
            </span>

        </label>

    </div>

    <button
        type="button"
        class="submit-btn"
        id="submitBtn"
    >
        무료 상담 신청하기
    </button>

    <div class="bottom-text">
        입력하신 정보는 상담 목적으로만 사용됩니다.
    </div>

</div>


<!-- Supabase CDN -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- script.js -->

<script src="script.js"></script>

</body>
</html>
