<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>무료상담</title>

<style>

body{
    margin:0;
    padding:0;
    background:#f5f5f5;
    font-family:'Pretendard',sans-serif;
}

.wrap{
    width:100%;
    max-width:600px;
    margin:0 auto;
    padding:40px 20px;
    box-sizing:border-box;
}

.title{
    font-size:32px;
    font-weight:700;
    text-align:center;
    margin-bottom:40px;
}

.input-box{
    margin-bottom:20px;
}

.input-box input,
.input-box textarea{

    width:100%;
    padding:16px;
    box-sizing:border-box;

    border:1px solid #ddd;
    border-radius:10px;

    font-size:16px;
    outline:none;
}

.input-box textarea{
    height:140px;
    resize:none;
}

.submit-btn{

    width:100%;
    height:60px;

    border:none;
    border-radius:12px;

    background:#F5D545;
    color:#000;

    font-size:20px;
    font-weight:700;

    cursor:pointer;

    transition:0.2s;
}

.submit-btn:hover{
    opacity:0.9;
}

</style>
</head>

<body>

<div class="wrap">

    <div class="title">
        무료 상담 신청
    </div>

    <div class="input-box">
        <input
            type="text"
            id="name"
            placeholder="이름 입력"
        >
    </div>

    <div class="input-box">
        <input
            type="tel"
            id="phone"
            placeholder="연락처 입력"
        >
    </div>

    <div class="input-box">
        <textarea
            id="content"
            placeholder="상담 내용을 입력해주세요"
        ></textarea>
    </div>

    <button
        type="button"
        class="submit-btn"
        id="submitBtn"
        onclick="submitConsultation()"
    >
        무료 상담 신청하기
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
