<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>무료 상담 신청</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="wrap">

    <div class="consult-box">

        <h1>
            무료 상담 신청
        </h1>

        <!-- 이름 -->
        <input
            type="text"
            id="name"
            class="input-box"
            placeholder="이름 입력"
        >

        <!-- 전화번호 -->
        <input
            type="text"
            id="phone"
            class="input-box"
            placeholder="전화번호 입력"
        >

        <div class="agree-wrap">

            <label class="agree-item">

                <input
                    type="checkbox"
                    checked
                >

                만 14세 이상입니다.
                <span>[필수]</span>

            </label>

            <label class="agree-item">

                <input
                    type="checkbox"
                    checked
                >

                개인정보 수집·이용 동의
                <span>[필수]</span>

            </label>

        </div>

        <button
            id="submitBtn"
            class="submit-btn"
        >
            무료 상담 신청하기
        </button>

        <p class="bottom-text">
            입력하신 정보는 상담 목적으로만 사용됩니다.
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
