<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CUSTOMER MANAGEMENT</title>

<link rel="stylesheet" href="crm.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="crm-wrap">

    <div class="sidebar">

        <div class="logo-box">
            <h1>CUSTOMER</h1>
            <p>MANAGEMENT</p>
        </div>

        <div class="menu-list">

            <button class="menu-btn active" data-mode="new">
                소개등록
            </button>

             <button class="menu-btn" data-mode="customer">
                명단
            </button>


            <button class="menu-btn" data-mode="customer">
                고객명단
            </button>

            <button class="menu-btn" data-mode="reserve">
                상담예정
            </button>

            <button class="menu-btn" data-mode="process">
                진행중
            </button>

            <button class="menu-btn" data-mode="done">
                완료
            </button>

            <button class="menu-btn" data-mode="memo">
                고객메모
            </button>

            <button class="menu-btn" data-mode="alarm">
                알람설정
            </button>

        </div>

    </div>

    <div class="main-area">

        <div class="top-bar">
            <div class="top-title">CUSTOMER CRM</div>
        </div>

        <div class="table-wrap">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>이름</th>
                        <th>연락처</th>
                        <th>상담 및 신청일</th>
                        <th>상태</th>
                        <th>상담 예정일</th>
                    </tr>
                </thead>

                <tbody id="crmBody"></tbody>
            </table>

        </div>

    </div>

</div>

<!-- =========================
     A4 1/4 대형 편집창
========================= -->

<div id="editorModal">

    <div id="editorBox">

        <div id="editorTitle">
            CRM 편집창
        </div>

        <textarea id="editorTextarea"></textarea>

        <div id="editorButtons">

            <button id="saveEditorBtn">
                저장
            </button>

            <button id="closeEditorBtn">
                닫기
            </button>

        </div>

    </div>

</div>

<script src="crm.js"></script>

</body>
</html>
