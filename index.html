<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>랜딩페이지</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    width:100%;
    min-height:100vh;

    background:#d9dddd;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:
    "Pretendard",
    "Noto Sans KR",
    sans-serif;
}

/* =========================================
   상담 박스
========================================= */

.consult-wrap{

    width:440px;

    background:#f4f4f4;

    border-radius:36px;

    padding:
    40px
    30px
    40px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.08);
}

/* =========================================
   타이틀
========================================= */

.title{

    text-align:center;

    font-size:64px;
    font-weight:800;

    color:#003b4d;

    line-height:1.2;

    margin-bottom:40px;
}

/* =========================================
   입력창
========================================= */

.input-box{
    margin-bottom:22px;
}

.input-box input{

    width:100%;
    height:78px;

    border:
    5px solid #c8ccd4;

    border-radius:24px;

    background:#dfe4ee;

    padding:0 26px;

    font-size:28px;

    outline:none;

    color:#111;
}

.input-box input::placeholder{
    color:#666;
}

/* =========================================
   체크박스
========================================= */

.check-area{

    margin-top:10px;
    margin-bottom:28px;
}

.check-item{

    display:flex;
    align-items:center;

    gap:14px;

    margin-bottom:16px;

    font-size:22px;

    color:#003b4d;
}

.check-item input{

    width:24px;
    height:24px;
}

.required{

    color:red;
    font-weight:700;
}

/* =========================================
   개인정보 자세히 보기 버튼
   기존 체크박스 구조 보존
========================================= */

.privacy-detail-btn{

    margin-left:6px;

    border:none;
    background:transparent;

    color:#6f7480;

    font-size:16px;
    font-weight:400;

    cursor:pointer;

    text-decoration:underline;
}

.privacy-detail-btn:hover{
    color:#003b4d;
}

/* =========================================
   버튼
========================================= */

.submit-btn{

    width:100%;
    height:112px;

    border:none;

    border-radius:32px;

    background:#ff8a00;

    color:#fff;

    font-size:34px;
    font-weight:800;

    cursor:pointer;

    transition:0.2s;
}

.submit-btn:hover{
    opacity:0.92;
}

/* =========================================
   하단 문구
========================================= */

.bottom-text{

    margin-top:34px;

    text-align:center;

    font-size:20px;

    color:#6f7480;

    line-height:1.6;
}

/* =========================================
   개인정보 수집·이용 동의 팝업
   기존 무료상담신청 기능과 분리
========================================= */

.privacy-modal{

    display:none;

    position:fixed;

    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:9999;
}

.privacy-modal.show{
    display:block;
}

.privacy-modal-bg{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.35);
}

.privacy-modal-box{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%, -50%);

    width:86%;
    max-width:390px;

    background:#ffffff;

    border-radius:18px;

    padding:
    26px
    26px
    24px;

    box-shadow:
    0 18px 45px rgba(0,0,0,0.25);
}

.privacy-modal-title{

    margin-bottom:22px;

    padding-right:34px;

    font-size:20px;
    font-weight:700;

    color:#111;

    line-height:1.4;
}

.privacy-modal-close{

    position:absolute;

    right:20px;
    top:18px;

    width:30px;
    height:30px;

    border:none;

    background:transparent;

    color:#999;

    font-size:30px;
    line-height:30px;

    cursor:pointer;
}

.privacy-modal-close:hover{
    color:#333;
}

.privacy-modal-content{

    color:#111;

    font-size:15px;

    line-height:1.8;
}

.privacy-modal-content p{

    margin-bottom:4px;
}

.privacy-modal-content .notice{

    margin-top:20px;

    color:#111;

    line-height:1.75;
}

</style>

</head>

<body>

<div class="consult-wrap">

    <div class="title">
        무료 상담 신청
    </div>

    <div class="input-box">

        <input
            type="text"
            id="name"
            placeholder="이름 입력"
        >

    </div>

    <div class="input-box">

        <input
            type="tel"
            id="phone"
            placeholder="전화번호 입력"
        >

    </div>

    <div class="check-area">

        <label class="check-item">

            <input
                type="checkbox"
                checked
            >

            <span>
                만 14세 이상입니다.
                <span class="required">[필수]</span>
            </span>

        </label>

        <label class="check-item">

            <input
                type="checkbox"
                checked
            >

            <span>
                개인정보 수집·이용 동의
                <span class="required">[필수]</span>

                <button
                    type="button"
                    id="privacyDetailBtn"
                    class="privacy-detail-btn"
                >
                    자세히 보기
                </button>
            </span>

        </label>

    </div>

    <!-- 핵심 수정 완료 -->
    <!-- onclick 삭제 -->

    <button
        type="button"
        class="submit-btn"
        id="submitBtn"
    >
        무료 상담 신청하기
    </button>

    <div class="bottom-text">
        입력하신 정보는 상담 목적으로만 사용됩니다.
    </div>

</div>


<!-- 개인정보 수집·이용 동의 상세 팝업 -->
<div
    id="privacyModal"
    class="privacy-modal"
>

    <div
        id="privacyModalBg"
        class="privacy-modal-bg"
    ></div>

    <div class="privacy-modal-box">

        <button
            type="button"
            id="privacyModalClose"
            class="privacy-modal-close"
        >
            ×
        </button>

        <div class="privacy-modal-title">
            개인정보 수집 및 이용 동의
        </div>

        <div class="privacy-modal-content">

            <p>
                • 수집·이용 목적 : 무료상담 신청 확인 및 상담 연락
            </p>

            <p>
                • 수집 항목 : 이름, 전화번호
            </p>

            <p>
                • 보유·이용기간 : 상담 신청일로부터 3개월까지 보관 후 파기
            </p>

            <p class="notice">
                ※ 개인정보 수집 및 이용에 대한 동의를 거부할 권리가 있습니다.<br>
                다만, 동의를 거부할 경우 무료상담 신청 및 상담 연락이 제한될 수 있습니다.
            </p>

        </div>

    </div>

</div>


<!-- 개인정보 자세히 보기 팝업 기능 -->
<script>
/* =========================================
   개인정보 수집·이용 동의 자세히 보기
   script.js / crm.js / crm.html 건드리지 않음
========================================= */

(function(){

    const privacyDetailBtn =
    document.getElementById(
        'privacyDetailBtn'
    );

    const privacyModal =
    document.getElementById(
        'privacyModal'
    );

    const privacyModalClose =
    document.getElementById(
        'privacyModalClose'
    );

    const privacyModalBg =
    document.getElementById(
        'privacyModalBg'
    );

    if(!privacyDetailBtn || !privacyModal){

        return;
    }

    privacyDetailBtn.addEventListener(
        'click',
        function(event){

            event.preventDefault();
            event.stopPropagation();

            privacyModal.classList.add(
                'show'
            );
        }
    );

    if(privacyModalClose){

        privacyModalClose.addEventListener(
            'click',
            function(){

                privacyModal.classList.remove(
                    'show'
                );
            }
        );
    }

    if(privacyModalBg){

        privacyModalBg.addEventListener(
            'click',
            function(){

                privacyModal.classList.remove(
                    'show'
                );
            }
        );
    }

})();
</script>


<!-- Supabase CDN -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- script.js -->

<script src="script.js"></script>

</body>
</html>
