<!DOCTYPE html>
<html lang="ko">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>맑음365 무료 상담</title>

  <link rel="stylesheet" href="style.css">

  <link
    rel="stylesheet"
    href="game/memory-number/memory-number.css"
  >

</head>

<body>

  <main class="page">

    <section class="hero">

      <div class="badge">
        무료 참여형 테스트
      </div>

      <h1>
        1분 숫자 기억 테스트
      </h1>

      <p class="hero-text">
        숫자가 잠시 보이면 기억한 뒤 입력해 주세요.
      </p>

    </section>

    <section class="game-box">

      <div
        id="numberDisplay"
        class="number-display"
      >
        • • • • •
      </div>

      <input
        id="answerInput"
        class="answer-input"
        type="tel"
        placeholder="기억한 숫자 입력"
        inputmode="numeric"
      >

      <!-- 시작하기 -->
      <button
        id="startGameBtn"
        class="main-btn"
      >
        테스트 시작하기
      </button>

      <!-- 확인하기 -->
      <button
        id="checkAnswerBtn"
        class="sub-btn"
        style="display:none;"
      >
        확인하기
      </button>

      <!-- 다시 테스트 -->
      <button
        id="restartGameBtn"
        class="restart-btn"
        style="display:none;"
      >
        다시 테스트하기
      </button>

      <div
        id="gameResult"
        class="game-result"
      ></div>

    </section>

    <section class="info-box">

      <h2>
        생활 관리가 중요할 수 있습니다
      </h2>

      <p>
        최근 깜빡하는 일이 늘었다면<br>
        혼자 고민하지 마시고
        간단한 상담을 받아보세요.
      </p>

    </section>

    <section class="form-box">

      <h2>무료 상담 신청</h2>

      <input
        id="userName"
        type="text"
        placeholder="성함"
      >

      <input
        id="userPhone"
        type="tel"
        placeholder="연락처"
      >

      <button
        id="submitBtn"
        class="submit-btn"
      >
        무료 상담 신청하기
      </button>

      <p class="privacy">
        입력하신 정보는 상담 목적에만 사용됩니다.
      </p>

    </section>

  </main>

  <script src="game/memory-number/memory-number.js"></script>

  <script src="script.js"></script>

</body>
</html>
